name: Import Wix media

# Run once from the Actions tab: copies the photos, CVs and video still hosted
# on Wix into this repository, then switches the site to these copies.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Download media from Wix
        run: python scripts/import_wix_media.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Import media from Wix into the repository"
          git push

      - name: Rebuild the GitHub Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" || echo "The site will update on the next build."

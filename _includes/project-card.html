{%- assign p = include.project -%}
<a class="card" href="{{ p.url | relative_url }}">
  <div class="card-media">
    {% include image.html img=p.cover alt=p.title max=960 sizes="(min-width: 1100px) 340px, (min-width: 640px) 45vw, 100vw" %}
  </div>
  <div class="card-body">
    <p class="card-meta">{{ p.year }}<span aria-hidden="true"> · </span>{{ p.type }}</p>
    <h3>{{ p.title }}</h3>
    <p class="card-summary">{{ p.summary }}</p>
    <p class="card-location">{{ p.location }}</p>
  </div>
</a>

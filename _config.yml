url: https://maximedumas46.github.io
baseurl: /e-portfolio

# CV files (PDF). Replace with local files (e.g. /assets/cv/CV_EN.pdf) if you add them to the repo.
cv:
  - label: CV (English)
    url: https://2955ad6c-541f-4ad0-80f1-370c22979e08.usrfiles.com/ugd/3d2323_903445f7b5f240baa4f0a963364af003.pdf
  - label: CV (Français)

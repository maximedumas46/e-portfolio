# Site settings
title: Maxime DUMAS
tagline: Portfolio — FISA 3EA
description: Portfolio of Maxime Dumas, engineering student specializing in electronics, electrical energy, and embedded systems.
lang: en
author: Maxime DUMAS

# GitHub Pages URL: https://maximedumas46.github.io/e-portfolio/
url: https://maximedumas46.github.io
baseurl: /e-portfolio

# Main menu
nav:
  - title: Home
    url: /
  - title: Projects
    url: /projects/
  - title: Engagement
    url: /engagement/
  - title: FutursProches
    url: /futursproches/
  - title: Mobility
    url: /mobility/
  - title: Sports
    url: /sports/
  - title: Contact
    url: /contact/

# Contact details (Contact page + footer)
contact:
  email: maxime.dumas@etu.toulouse-inp.fr
  linkedin: https://www.linkedin.com/in/maxime-dumas-22b062258/

# CV files (PDF) and their preview images
cv:
  - label: CV_ENGLISH
    lang: English
    url: /assets/cv/CV_DUMAS_MAXIME_ENGLISH.pdf
    preview:
      id: "3d2323_6ad9710460a548d5b60cd45a441441e6~mv2.png"
      width: 927
      height: 1312
      alt: "Preview of the English CV"
  - label: CV_FRANCAIS
    lang: Français
    url: /assets/cv/CV_DUMAS_MAXIME_FRANCAIS.pdf
    preview:
      id: "3d2323_24cffc80cc0341539d6aab375f98693b~mv2.png"
      width: 945
      height: 1330
      alt: "Aperçu du CV en français"

# false = photos are loaded from Wix; true = local copies in assets/media/
# (set automatically by the "Import Wix media" workflow)
media_local: true
# Projects: one Markdown file per project in _projects/
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
